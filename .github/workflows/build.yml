name: Build FFmpeg 16KB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y nasm yasm pkg-config

      - name: Download Modern NDK and Compile Engine
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
          unzip -q android-ndk-r27b-linux.zip
          export ANDROID_SDK_HOME=$ANDROID_HOME
          export ANDROID_NDK_HOME=$(pwd)/android-ndk-r27b
          
          # 1. Safely disable heavy categories (Leaves Android JNI & Threading intact)
          DISABLE_FLAGS="--disable-programs --disable-doc --disable-network --disable-hwaccels --disable-encoders --disable-muxers --disable-filters --disable-devices --disable-postproc --disable-swscale --disable-avdevice --disable-decoders --disable-demuxers --disable-parsers --disable-protocols"
          
          # 2. Re-enable only the strict audiophile core required for the engine
          ENABLE_FLAGS="--enable-protocol=file --enable-demuxer=flac,mp3,wav,aac,mov,dsf,ape,ogg --enable-parser=flac,mpegaudio,aac --enable-decoder=flac,alac,mp3,mp3float,aac,ape,vorbis,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le,dsd_lsbf,dsd_msbf,dsd_lsbf_planar,dsd_msbf_planar"
          
          # 3. Export cleanly to the environment variable supported by the maker script
          export EXTRA_BUILD_CONFIGURATION_FLAGS="$DISABLE_FLAGS $ENABLE_FLAGS"
          
          # 4. Build strictly for 64-bit ARM to prevent bloated Fat APKs
          ./ffmpeg-android-maker.sh --target-abis=arm64-v8a
          
      - name: Save and Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-16kb-binaries
          path: output/
