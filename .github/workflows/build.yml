name: Build FFmpeg 16KB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y nasm yasm pkg-config

      - name: Download Modern NDK and Compile Engine
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
          unzip -q android-ndk-r27b-linux.zip
          export ANDROID_SDK_HOME=$ANDROID_HOME
          export ANDROID_NDK_HOME=$(pwd)/android-ndk-r27b
          
          # Forcefully inject the pruning flags (Now safely unrolled into individual commands to prevent syntax errors)
          sed -i '2i EXTRA_BUILD_CONFIGURATION_FLAGS="$EXTRA_BUILD_CONFIGURATION_FLAGS --disable-everything --disable-programs --disable-doc --disable-network --disable-hwaccels --disable-encoders --disable-muxers --disable-filters --disable-devices --disable-postproc --disable-swscale --disable-avdevice --enable-avcodec --enable-avformat --enable-avutil --enable-swresample --enable-protocol=file --enable-demuxer=flac --enable-demuxer=mp3 --enable-demuxer=wav --enable-demuxer=aac --enable-demuxer=mov --enable-demuxer=dsf --enable-demuxer=ape --enable-demuxer=ogg --enable-parser=flac --enable-parser=mpegaudio --enable-parser=aac --enable-decoder=flac --enable-decoder=alac --enable-decoder=mp3 --enable-decoder=mp3float --enable-decoder=aac --enable-decoder=ape --enable-decoder=vorbis --enable-decoder=pcm_s16le --enable-decoder=pcm_s24le --enable-decoder=pcm_s32le --enable-decoder=pcm_f32le --enable-decoder=dsd_lsbf --enable-decoder=dsd_msbf --enable-decoder=dsd_lsbf_planar --enable-decoder=dsd_msbf_planar"' scripts/ffmpeg/build.sh
          
          # Run the build exclusively for 64-bit ARM 
          ./ffmpeg-android-maker.sh --target-abis=arm64-v8a
          
      - name: Save and Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-16kb-binaries
          path: output/
